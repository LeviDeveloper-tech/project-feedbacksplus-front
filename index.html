<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/index.css">
    <title>Feedback Plus - Login</title>
</head>
<body>
    <main id="login-container">
        <header class="login-header">
            <h1>Feedback Plus</h1>
            <p>Aqui sua voz é nossa prioridade!</p>
        </header>

        <section id="main-section">
            <form id="form-login" class="login-card">
                <h2>Acesse sua conta</h2>
                
                <div class="input-group">
                    <label for="username-input">Usuário</label>
                    <input type="text" id="username-input" name="login" placeholder="Digite seu usuário" required>
                </div>
                
                <div class="input-group">
                    <label for="password-input">Senha</label>
                    <input type="password" id="password-input" name="senha" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" id="btn-form">Entrar</button>
                
                <div class="login-footer">
                    <p>Não tem conta? 
                        <a href="./pages/register.html">Clique aqui e crie a sua!</a>
                    </p>
                </div>
            </form>
        </section>
    </main>

    <script src="./src/js/login.js" defer></script>
</body>
</html>
