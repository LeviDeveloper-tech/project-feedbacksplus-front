<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Plus - Cadastro de Empresa</title>
    <link rel="stylesheet" href="../src/css/register-empresa.css">
</head>

<body>
    <main id="register-container">
        <header class="register-header">
            <h1>Cadastre sua Empresa</h1>
            <p>Gerencie seus feedbacks e melhore seu relacionamento corporativo.</p>
        </header>

        <section id="main-section">
            <form id="form-registro-empresa" class="register-card">

                <div class="input-row">
                    <div class="input-group">
                        <label for="nome">Razão Social / Nome Fantasia</label>
                        <input type="text" id="nome" placeholder="Nome da empresa" required>
                    </div>
                    <div class="input-group">
                        <label for="cpf">CNPJ</label>
                        <input type="text" id="cpf" placeholder="00.000.000/0000-00" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="telefone">Telefone Comercial</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="input-group">
                        <label for="login">Login de Acesso</label>
                        <input type="text" id="login" placeholder="Ex: empresa.sucesso" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="********" required>
                    </div>
                    <div class="input-group">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" placeholder="********" required>
                    </div>
                </div>

                <button type="submit" id="button">Finalizar Cadastro</button>

                <div class="register-footer">
                    <a href="../index.html">Já tem uma conta? Volte ao login</a>
                </div>
            </form>
        </section>
    </main>

    <script src="../src/js/register-empresa.js"></script>
</body>

</html>
