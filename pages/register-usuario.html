<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Plus - Cadastre-se</title>
    <link rel="stylesheet" href="../src/css/register-usuario.css">
</head>

<body>
    <main id="register-container">
        <header class="register-header">
            <h1>Crie sua Conta</h1>
            <p>Junte-se ao Feedback Plus e faça a diferença.</p>
        </header>

        <section id="main-section">
            <form id="form-register" class="register-card">

                <div class="input-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="input-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="login">Nome de Usuário (Login)</label>
                    <input type="text" id="login" placeholder="Escolha um login" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="********" required>
                    </div>
                    <div class="input-group">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" placeholder="********" required>
                    </div>
                </div>

                <button type="submit" id="button">Finalizar Cadastro</button>

                <div class="register-footer">
                    <a href="../index.html">Já tem uma conta? Volte ao login</a>
                </div>
            </form>
        </section>
    </main>

    <div id="modal-revisao" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confira seus dados</h3>
            </div>
            <div id="lista-revisao" class="revisao-dados">
            </div>

            <div class="modal-actions">
                <button id="confirmar-final" class="btn-confirm">Confirmar e Enviar</button>
                <button type="button" class="btn-cancel"
                    onclick="document.getElementById('modal-revisao').style.display='none'">
                    Cancelar e Editar
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="../src/js/register-usuario.js"></script>
</body>

</html>
